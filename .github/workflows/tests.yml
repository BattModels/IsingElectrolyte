name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quick:
    name: quick tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install ".[dev]"
      - name: Quick tests
        run: pytest -m "not slow" -v

  full:
    name: full tests incl. tutorial and training script
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install ".[dev]"
      - name: All tests
        run: pytest -v
