# IsingElectrolyte training configuration
# Run from the repository root:
#   python examples/train_lhce.py examples/config.yaml
#
# Paths are relative to the directory you run the command from.

# --- Data paths ---
# Fold 0 of the paper's 5-fold cross-validation split (examples/data/lhce_md/fold_{0..4}).
train: examples/data/lhce_md/fold_0/train.csv
val:   examples/data/lhce_md/fold_0/val.csv
test:  examples/data/lhce_md/fold_0/test.csv

# --- Training ---
epochs:  1000
trials:  10
seed:    42

# --- Output ---
checkpoint: trained_params.pkl

# --- Optimizer ---
learning_rate:   0.002   # paper schedule; 0.01 drives the root solver to NaN
lr_decay_steps:  1000
lr_decay_rate:   0.95

# --- Term-function overrides (optional) ---
# Specify a function name from IsingElectrolyte.interactions to replace the default.
# Add your new function to interactions.py, then reference it by name here.
# Omit a field (or set to null) to keep the package default.
#
# h_sol_func:     null   # default: expfunc(dn_eff) + logfunc(x),  5 params
# h_an_func:      null   # default: expfunc(dn_an)  + logfunc(x),  5 params
# j_sol_sol_func: null   # default: DN/AN cross + DN-DN + AN-AN,  16 params
# j_sol_an_func:  null   # default: sol_sol_func(dn_an, an_sol),   6 params
# j_an_an_func:   null   # default: sol_sol_func(dn_i, dn_j),      6 params

# --- Optional rescale function overrides (string names from IsingElectrolyte.interactions) ---
# These functions rescale the parameters through jnp.softplus to ensure desired monotonicity constraints.
# Omit a field (or set to null) to keep the companion of the package default term function.
#
# rescale_h_sol:       default_h_sol_rescale
# rescale_h_an:        default_h_an_rescale
# rescale_J_sol_sol:   default_J_sol_sol_rescale
# rescale_J_sol_an:    default_J_sol_an_rescale
# rescale_J_an_an:     default_J_an_an_rescale
# rescale_conc_factor: default_conc_factor_rescale

# --- Monotonicity constraints (optional) ---
# Controls the sign of softplus-rescaled parameters.
# Omit this section (or set to null) to use the physically motivated constraints
# listed below; they are also train_lhce.py's default without a config file.
# Set individual keys to "decrease", "increase", or "none";
# keys you do not list are unconstrained ("none").
# Unconstrained groups start from the hand-tuned values as the constrained model
# sees them (after the softplus), so training starts from the same physical model;
# it can still diverge later, and diverged trials are discarded.
#
# Keys:
#   sol_params_dn       h(Li-sol) field  (default: decrease with DN)
#   salt_params_dn      h(Li-anion) field (default: decrease with DN)
#   params_sol_salt_an  J(sol-anion)     (default: decrease with DN/AN)
#   params_sol_sol      J(sol-sol)       (default: decrease with DN/AN)
#   params_anion_anion  J(anion-anion)   (default: increase with DN)
#   conc_factor_sol     concentration factor (default: increase with x, V)
#
# Used here, and also the default if this section is omitted —
# the physically motivated constraints from the paper:
monotonicity_dict:
  sol_params_dn:      decrease
  salt_params_dn:     decrease
  params_sol_salt_an: decrease
  params_sol_sol:     decrease
  params_anion_anion: increase
  conc_factor_sol:    increase
#
# Example — flip anion-anion direction only:
# monotonicity_dict:
#   sol_params_dn:      decrease
#   salt_params_dn:     decrease
#   params_sol_salt_an: decrease
#   params_sol_sol:     decrease
#   params_anion_anion: decrease
#   conc_factor_sol:    increase
#
# Example — disable all monotonicity constraints:
# monotonicity_dict: {}

# --- Parameter initialization (optional) ---
# Keys map directly to initialize_params() kwargs.
# 'random_seed' is always computed per-trial and is ignored if set here.
# If 'mode' is omitted, initialize_params() uses "from_file" when file_path is
# given and "from_scratch" otherwise.
# 'monotonicity_dict' defaults to the one above (picks the start for unconstrained
# groups); set it to null to start every group from the raw hand-tuned values.
#
initialize_params_kwargs:
  mode: from_scratch
#
# From checkpoint:
# initialize_params_kwargs:
#   mode: from_file
#   file_path: /path/to/checkpoint.pkl
#
# Custom parameter sizes (for non-default interaction functions).
# Arrays with custom sizes are initialized as zeros + noise.
# Default sizes: sol_params_dn=5, salt_params_dn=5, params_sol_salt_an=6,
#                params_sol_sol=16, params_anion_anion=6, conc_factor_sol=8
# initialize_params_kwargs:
#   mode: from_scratch
#   param_sizes:
#     params_sol_sol: 9
#     sol_params_dn: 8
