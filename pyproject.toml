[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "IsingLHCE"
version = "0.1.0"
description = "Differentiable mean-field Ising model of Li+ solvation shell composition for electrolyte design"
authors = [
  { name = "Hancheng Zhao", email = "zhaohc@umich.edu" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["electrolyte", "solvation", "Ising model", "JAX", "lithium battery", "LHCE"]

dependencies = [
  "jax",
  "jaxopt",
  "optax",
  "numpy",
  "pandas",
  "matplotlib",
  "tqdm",
  "pyyaml",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[project.urls]
paper = "https://arxiv.org/abs/2609.05671"
repository = "https://github.com/hancheng2000/IsingLHCE"
issues = "https://github.com/hancheng2000/IsingLHCE/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
IsingLHCE = ["pretrained_models/*.npz", "analysis/*.csv"]
